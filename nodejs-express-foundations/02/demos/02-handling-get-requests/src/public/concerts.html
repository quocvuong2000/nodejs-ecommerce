<!DOCTYPE html>
<html>
  <head>
    <title>Globoticket</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/normalize.css" />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1><img src="/img/globoticket-horizontal-white.svg"></h1>
        <div class="header-cart">
          <img src="/img/cart.svg" />
          <p><span>0</span> tickets</p>
        </div>
      </header>
      <section>
        <div class="table">
          <table>
            <thead>
              <tr>
                <th scope="col">&nbsp;</th>
                <th scope="col">Date</th>
                <th scope="col">Name</th>
                <th scope="col">Price</th>
                <th scope="col">Purchase Link</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="concert-image">
                  <img src="/img/shutterstock_415922566_thumbnail_1.jpg" />
                </td>
                <td class="concert-date">9/2/2024<br />11:00 PM</td>
                <td class="concert-artist">Alexander Lemtov</td>
                <td class="concert-price">$65</td>
                <td class="concert-purchase-button"><a href="concert.html"><button>Purchase Details</button></a></td>
              </tr>
              <tr>
                <td class="concert-image">
                  <img src="/img/shutterstock_606456248_thumbnail_2.jpg" />
                </td>
                <td class="concert-date">9/24/2024<br />8:00 PM</td>
                <td class="concert-artist">Santiago Martinez</td>
                <td class="concert-price">$135</td>
                <td class="concert-purchase-button"><button>Purchase Details</button></td>
              </tr>
              <tr>
                <td class="concert-image">
                  <img src="/img/shutterstock_1746589040_thumbnail_3.jpg" />
                </td>
                <td class="concert-date">10/4/2024<br />7:00 PM</td>
                <td class="concert-artist">Miriam Johnson</td>
                <td class="concert-price">$85</td>
                <td class="concert-purchase-button"><button>Purchase Details</button></td>
              </tr>
            </tbody>
          </table>          
        </div>
      </section>
    </div>
  </body>
</html>
